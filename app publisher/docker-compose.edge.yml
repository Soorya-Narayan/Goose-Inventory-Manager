version: '2.4'

services:

  # ─── React/Nginx frontend ─────────────────────────────────────────────────
  frontend:
    image: cip-dashboard:1.0.0
    container_name: cip-dashboard
    restart: always
    ports:
      - "8888"
    environment:
      - API_BASE_URL=/api
      - IIH_BASE_URL=/iih
    depends_on:
      - backend
    networks:
      - proxy-redirect
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 300m

  # ─── Express API backend (simulation → IIH switchable) ───────────────────
  backend:
    image: cip-backend:1.0.0
    container_name: cip-backend
    restart: always
    environment:
      - PORT=3000
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # DATA_SOURCE controls where data comes from:
      #   simulation  →  built-in S7 PLC simulator (use this NOW)
      #   iih         →  proxies to IIH Essentials DataService (use LATER)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - DATA_SOURCE=simulation
      - IIH_BASE_URL=http://edgeappdataservice:4203
      - DATABUS_URL=mqtt://ie-databus:1883
      - DATABUS_USER=Edge
      - DATABUS_PASS=Edge123
    networks:
      - proxy-redirect
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m

networks:
  proxy-redirect:
    external: true   # Created by IE runtime
