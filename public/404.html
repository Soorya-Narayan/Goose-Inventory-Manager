<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Primary Meta Title & SEO Meta Tags -->
  <title>404 — Page Not Found | Goose Inventory Manager</title>
  <meta name="description" content="The page or resource you requested could not be found in Goose Inventory Manager. Return to store inventory overview or shelf map." />
  <meta name="robots" content="noindex, follow" />

  <!-- OpenGraph Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="404 — Page Not Found | Goose Inventory Manager" />
  <meta property="og:description" content="The requested page could not be located in Goose Inventory Manager." />
  <meta property="og:site_name" content="Goose Inventory Manager" />
  <meta property="og:image" content="/goose_logo_new.png" />

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" href="/goose_logo_new.png" />
  <link rel="apple-touch-icon" href="/goose_logo_new.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/style.css?v=3.0.8" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080c14;
      background-image: 
        radial-gradient(ellipse 80% 80% at 50% -20%, rgba(16, 185, 129, 0.15), rgba(255, 255, 255, 0)),
        radial-gradient(ellipse 60% 60% at 50% 120%, rgba(59, 130, 246, 0.1), rgba(255, 255, 255, 0));
      padding: 1.5rem;
      font-family: var(--font-sans, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif);
      color: var(--text-primary, #f8fafc);
      overflow-x: hidden;
    }

    .error-card {
      max-width: 580px;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-highlight, rgba(255, 255, 255, 0.15));
      border-radius: var(--radius-xl, 16px);
      padding: 2.5rem 2rem;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.7);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .error-code {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(16, 185, 129, 0.3);
    }

    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary, #f8fafc);
      letter-spacing: -0.02em;
      margin-top: -0.5rem;
    }

    .error-desc {
      font-size: 0.9rem;
      color: var(--text-secondary, #94a3b8);
      line-height: 1.6;
      margin-top: -0.5rem;
    }

    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-md, 8px);
      text-decoration: none;
      transition: all 0.18s ease;
      cursor: pointer;
    }

    .btn-primary-action {
      background: var(--goose, #10b981);
      color: #042f1e;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }
    .btn-primary-action:hover {
      background: #34d399;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-ghost-action {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary, #f8fafc);
      border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
    }
    .btn-ghost-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-highlight, rgba(255, 255, 255, 0.25));
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div style="margin-bottom: 0.25rem">
      <img src="/goose_logo_new.png" alt="Goose Industrial Systems" width="160" style="max-width:100%;height:auto" />
    </div>

    <div>
      <div class="error-badge">
        <span style="background:#ef4444;width:6px;height:6px;border-radius:50%;display:inline-block"></span>
        <span>ERROR 404 &middot; RESOURCE NOT FOUND</span>
      </div>
    </div>

    <div class="error-code">404</div>

    <h1 class="error-title">Page or Shelf Route Not Found</h1>

    <p class="error-desc">
      The requested shelf coordinate, system path, or material URL entry does not exist or has been relocated within the store catalog.
    </p>

    <div class="btn-group">
      <a href="/" class="btn-action btn-primary-action">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Return to Dashboard</span>
      </a>
      <a href="/" class="btn-action btn-ghost-action">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        <span>View Store Inventory</span>
      </a>
    </div>

    <div style="border-top:1px solid var(--border-subtle, rgba(255,255,255,0.08));padding-top:1.25rem;width:100%;font-size:0.75rem;color:var(--text-tertiary, #64748b);font-family:var(--font-mono, monospace)">
      INVENTORY SYSTEM v3.0.8 &middot; GOOSE INDUSTRIAL SOLUTIONS PVT LTD
    </div>
  </div>

</body>
</html>
