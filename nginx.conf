server {
    listen 8888;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------
    # React SPA routing
    # -----------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # -----------------------------
    # Runtime config (NO CACHE)
    # -----------------------------
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires off;
    }

    # -----------------------------
    # Backend API → Node-RED HTTP Server
    # Node-RED on the Edge device exposes HTTP endpoints on port 1880.
    # Dashboard calls /api/iih/* → nginx proxies → Node-RED flow answers.
    # ie-databus resolves inside the proxy-redirect Docker network.
    # -----------------------------
    location /api/ {
        proxy_pass http://cip-backend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # -----------------------------
    # IIH Essentials DataService proxy
    # Forwards /iih/* → http://edgeappdataservice:4203/*
    # This avoids CORS issues (same-origin from browser perspective)
    # No auth needed: internal Docker network call
    # -----------------------------
    location /iih/ {
        # Route through our Express backend which handles simulation vs real IIH proxying based on DATA_SOURCE
        proxy_pass http://cip-backend:3000/iih/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time data
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # -----------------------------
    # Static assets caching
    # -----------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -----------------------------
    # Security headers (safe defaults)
    # -----------------------------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
