version: '3.8'

services:
  frontend:
    image: cip-dashboard:1.0.0
    container_name: cip-dashboard
    restart: always
    ports:
      - "8888:8888"
    environment:
      # No backend needed — dashboard reads directly from IIH via nginx proxy
      - API_BASE_URL=/api
      - IIH_BASE_URL=/iih
    networks:
      - proxy-redirect   # Standard IE network — gives access to edgeappdataservice
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy-redirect:
    external: true   # Must exist on the Edge device (created by IE runtime)
